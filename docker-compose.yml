# Local full-stack orchestration for SwarmOps.
# P00: API + Web only. Postgres/Firestore emulators arrive in later phases.

services:
  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: development
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./apps/web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api
