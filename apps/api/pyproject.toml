[project]
name = "swarmops-api"
version = "0.0.0"
description = "SwarmOps — Enterprise Agent Control Plane (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
# The Gemini governance explanation layer (P07). Optional: without it the
# GovernanceAgent degrades to a clearly-labeled local template.
ai = [
    "google-genai>=1.0",
]
# OpenTelemetry export to Cloud Trace (P09). Optional: without it the audit trail
# retains local, trace-correlated telemetry.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-gcp-trace>=1.6",
]
# Google Cloud persistence + eventing (P12). Optional: the default backend is local
# SQLite with an in-memory event bus.
gcp = [
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is idiomatic.
    "UP042",  # (str, Enum) is intentional and explicit for JSON-stable enums.
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
