# Builds the web image with the API URL baked in (NEXT_PUBLIC_* is build-time in Next.js).
# Usage:
#   gcloud builds submit apps/web --config infrastructure/cloudbuild-web.yaml \
#     --substitutions _API_URL=https://…run.app,_IMAGE=REGION-docker.pkg.dev/PROJECT/swarmops/web:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
